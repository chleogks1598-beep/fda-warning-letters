name: Notify FDA Warning Letter

# public/data.json 이 바뀐 푸시마다 직전 커밋과 비교해 신규·종결·목록삭제·요약완료 건만
# 뽑아 메일로 보낸다. 수신자: recipients.json
#
# ★ 문서·스크립트만 푸시하면 이 워크플로우는 돌지 않는다(paths 필터). data.json 이 바뀐
#   푸시에서만 메일이 간다 — 문서 커밋마다 메일이 오는 일을 막으려는 의도다.
on:
  push:
    branches: [main]
    paths:
      - 'public/data.json'
  workflow_call:
    inputs:
      ref:
        description: '비교 기준이 될 커밋(보통 방금 만든 커밋의 sha)'
        type: string
        required: false
        default: ''
      prev_ref:
        description: '직전 스냅샷을 뽑을 커밋(비우면 HEAD~1)'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      sample:
        description: '테스트 발송: 최근 N건으로 샘플 메일 (0=실제 diff)'
        required: false
        default: '0'
      prev_ref:
        description: '보정 발송: 이 커밋 이후의 변화를 한 번에 알림 (비우면 HEAD~1)'
        required: false
        default: ''

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # 옛 커밋과 비교하는 보정 발송일 때만 전체 이력이 필요하다.
          fetch-depth: ${{ (inputs.prev_ref || github.event.inputs.prev_ref) && '0' || '2' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 직전 스냅샷 확보
        env:
          PREV: ${{ inputs.prev_ref || github.event.inputs.prev_ref || 'HEAD~1' }}
        run: |
          echo "비교 기준: $PREV"
          git show "$PREV:public/data.json" > prev-data.json 2>/dev/null || echo '{"records":[]}' > prev-data.json
      - name: 메일 본문 생성 (직전 대비 diff)
        id: build
        env:
          SAMPLE: ${{ github.event.inputs.sample }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build-email.mjs prev-data.json
      - name: Send email via Gmail SMTP
        if: steps.build.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: FDA Warning Letter <${{ secrets.MAIL_USERNAME }}>
          to: ${{ steps.build.outputs.to }}
          subject: ${{ steps.build.outputs.subject }}
          html_body: file://email-body.html
      - name: No email needed
        if: steps.build.outputs.send != 'true'
        run: echo "신규·변경 없음 — 메일 발송 생략."
